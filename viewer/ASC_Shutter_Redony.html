<script>
	var address = window.location.hostname;
	var port = window.location.port;
	var proto = window.location.protocol + '//';

	if (typeof window.TranslationLoader === 'undefined') {

		class TranslationLoader {
			constructor() {
				this.translations = {};

				//	Egyetlen betöltési pont
				this.loaded = this.loadTranslations().then(t => {
					this.translations = t || {};
					if (!$.isEmptyObject(this.translations)) {
						this.translatePage();
					} else {
						console.error("Translation file unavailable; English labels will be used. | A fordítási fájl nem érhető el; angol feliratok jelennek meg.");
					}
				});
			}

			async loadTranslations() {

				if (typeof proto === 'undefined' || typeof address === 'undefined' || typeof port === 'undefined') {
					console.error("Missing protocol, address or port. | Hiányzó protokoll, cím vagy port.");
					return {};
				}

				let aktlanguage;
				const settingsUrl = `${proto}${address}:${port}/json.htm?type=command&param=getsettings`;

				try {
					const response = await fetch(settingsUrl);
					if (!response.ok) throw new Error("Network error | Hálózati hiba");
					const data = await response.json();
					aktlanguage = String(data.Language || "en").toLowerCase().split(/[-_]/)[0];
				} catch (e) {
					console.error("Language lookup failed | Nyelvlekérdezési hiba:", e);
					return {};
				}

				const filePath = `/templates/asc_html_translate_${aktlanguage}.json`;

				try {
					return await $.getJSON(filePath);
				} catch (e) {
					console.warn(`Translation file unavailable | Fordítási fájl nem érhető el: ${filePath}`, e);
					if (aktlanguage !== "en") {
						try { return await $.getJSON("/templates/asc_html_translate_en.json"); } catch (_) {}
					}
					return {};
				}
			}

			t(text) {
				return Object.prototype.hasOwnProperty.call(this.translations, text) ? this.translations[text] : text;
			}

			translatePage() {
				$('[data-translate]').each((_, el) => {
					const key = $(el).data('translate');
					$(el).text(this.t(key));
				});
			}
		}

		window.TranslationLoader = TranslationLoader;
	}
		var script = document.createElement('script');
		script.src = 'templates/asc_viewer.js?' + Date.now();
		window.ascViewerLoaded = new Promise((resolve, reject) => {
			script.onload = resolve;
			script.onerror = () => reject(new Error("ASC viewer script failed to load | Az ASC viewer szkript nem tölthető be"));
			document.head.appendChild(script);
		});
		
	</script>

	<script>

	Date.prototype.yyyymmdd_hhmm = function() {
		return this.getFullYear().toString() +
			("0" + (this.getMonth() + 1)).slice(-2) +
			("0" + this.getDate()).slice(-2) + "_" +
			("0" + this.getHours()).slice(-2) +
			("0" + this.getMinutes()).slice(-2);
	};


	function showSaveStatus() {
		console.log("Saving | Mentés");
		document.getElementById("saveStatus").style.display = "block";
	}

	function hideSaveStatus() {
		document.getElementById("saveStatus").style.display = "none";
	}

	if (typeof window.translationLoader === 'undefined') {

	}

		function download(filename, text) {
			var element = document.createElement('a');
			element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
			element.setAttribute('download', filename);

			element.style.display = 'none';
			document.body.appendChild(element);

			element.click();

			document.body.removeChild(element);
		}

							x: +(new Date(item.d)),

			if(data.tempOut != undefined) {

					})

					yAxis: 0,

							y: item.lux/100
						}
					})

			}
			if(data.nyitlux != undefined) {

					name: translationLoader.t("Opening lux value (lux/100)"),
					yAxis: 0,
					step: true,
					data: data.nyitlux.map(function (item) {
						return {
							x: +(new Date(item.d)),

					})

			if(data.eroslux != undefined) {

							x: +(new Date(item.d)),
							y: item.lux/100

					})
				});
			}
			if(data.redonykapcs != undefined) {
				series.push({
					name: translationLoader.t("Shutter switch"),
					yAxis: 0,
					step: true,
					data: data.redonykapcs.map(function (item) {
						return {
							x: +(new Date(item.d)),
							y: parseFloat(item.v)
						}

				});
			}
			if(data.wind != undefined) {

					name: translationLoader.t("Wind (km/h)"),

					step: true,

						return {

			if(data.vibration != undefined) {

					yAxis: 0,
					step: true,
					data: data.vibration.map(function (item) {
						return {
							x: +(new Date(item.Date)),
							y: item.Data === "On" ? 100 : 0
						}
					})
				});
			}
			chartElement.highcharts({

					zoomType: 'x'
				},
				title: {
					text: ''
				},
				xAxis: {
					type: 'datetime',
					minTickInterval: 24 * 3600 * 1000
				},
				yAxis: [
					{
						title: {
							text: translationLoader.t("Temperature (°C)")
						},
						maxPadding: 0
					},
					{
						title: {
							text: translationLoader.t("Position (%)")
						},
						maxPadding: 0
					},
					{
						title: {
							text: translationLoader.t("Wind (km/h)")
						},
						maxPadding: 0
					},
					{
						title: {
							text: translationLoader.t("Brightness (lux/100)")
						},
						maxPadding: 0
					}

				],
				tooltip: {
					formatter: function () {
						return Highcharts.dateFormat('%Y-%m-%d %H:%M', this.x) + '<br/>' + this.series.name + ': ' + Highcharts.numberFormat(this.y,1);
					}
				},
				plotOptions: {
					column: {
						minPointLength: 4,
						pointPadding: 0.1,
						groupPadding: 0,
						dataLabels: {
							enabled: true,
							color: 'white',
							format: '{y} °C'
						}
					},
					series: {
						turboThreshold : 0
					}
				},
				legend: {
					enabled: true
				},
				series: series
			});
		}
		var asc=await getRedony();
		var askJSON = getRequestParam("redonyHistory");
		if(askJSON != undefined) {
			var th = asc.filter((t) => t.name == askJSON);
			if(th.length > 0) {
				var s = JSON.stringify(th[0]);
				download(th[0].name+'_'+new Date().yyyymmdd_hhmm(), s);
			}
		} else {
			if (nodata) {
				document.getElementById("status").innerText = translationLoader.t("No active plugins!");
				hideSaveStatus();
				return;
			}
			for(var i=0;i<asc.length;i++) {
				
				var table = document.createElement('table');
				table.setAttribute('style', 'border-spacing: 5px;');
				document.getElementById('asc_content').appendChild(table);

				var row = table.insertRow();
				var cell1 = row.insertCell(0);
				
				var redname = document.createElement('h1');
				redname.setAttribute('style', 'margin-top:15px; margin-bottom: 10px;');
				redname.innerText = asc[i].name;
				cell1.appendChild(redname);

				var row = table.insertRow();
				var cell1 = row.insertCell(0);

				// graf ----------------------------------------------------------------
				
				var element = document.createElement('h2');
				element.innerText = translationLoader.t("The last day:");
				element.setAttribute('style', 'margin-top:15px; margin-bottom: 10px;');
				document.getElementById('asc_content').appendChild(element);
				
				element = document.createElement('div');
				element.setAttribute('class', 'device-log-chart');
				element.setAttribute('style', 'margin-bottom: 60px;');
				element.setAttribute('id', 'graphk'+i);
				document.getElementById('asc_content').appendChild(element);
				showUsageChart(asc[i], i);

				var table = document.createElement('table');
				table.setAttribute('style', 'border-spacing: 5px;');
				document.getElementById('asc_content').appendChild(table);

				var row = table.insertRow();
				var cell1 = row.insertCell(0);

				var redcim = document.createElement('h2');
				redcim.innerText = translationLoader.t("Setting of operating parameters");
				cell1.appendChild(redcim);

				function createChip(label, id, dropZone, hiddenInput, datasetKey, draggable = true) {
					const chip = document.createElement('div');
					chip.className = 'device';
					chip.innerHTML = `${label} (ID: ${id}) <span class="remove-x" style="color:red; cursor:pointer; margin-left:8px;">✖</span>`;
					chip.dataset.id = id;

					if (draggable) {
						chip.setAttribute('draggable', 'true');

						chip.addEventListener('dragstart', e => {
							e.dataTransfer.setData('remove-id', id);
						});

						chip.addEventListener('dragend', e => {
							if (!dropZone.contains(chip)) {
								chip.remove();
								let updatedIds = dropZone.dataset[datasetKey].split(',').filter(existingId => existingId !== id);
								dropZone.dataset[datasetKey] = updatedIds.join(',');
								hiddenInput.value = updatedIds.join(',');
							}
						});
					}

					chip.querySelector('.remove-x').addEventListener('click', e => {
						e.stopPropagation();
						chip.remove();
						let updatedIds = dropZone.dataset[datasetKey].split(',').filter(existingId => existingId !== id);
						dropZone.dataset[datasetKey] = updatedIds.join(',');
						hiddenInput.value = updatedIds.join(',');
					});

					return chip;
				}

				if (!asc[i].windnameakt) asc[i].windnameakt = [];
				if (!asc[i].switchnameakt) asc[i].switchnameakt = [];
				if (!asc[i].tempnameakt) asc[i].tempnameakt = [];
				if (!asc[i].luxnameakt) asc[i].luxnameakt = [];
				if (!asc[i].vibnameakt) asc[i].vibnameakt = [];

				function createDropBlock(asc, i, config) {
					const { mode, link, title, forparam, modePrefix, targetId, datasetKey, inputName } = config;

					let table = document.createElement('table');
					table.setAttribute('style', 'width:100%; border-spacing: 3px; margin-bottom: 10px;');
					document.getElementById('asc_content').appendChild(table);

					let row1 = table.insertRow();
					let cell1 = row1.insertCell(0);

					let chooserToggleName = document.createElement('span');
					chooserToggleName.textContent = translationLoader.t(title);
					chooserToggleName.className = 'paramname';
					cell1.appendChild(chooserToggleName);

					let chooserToggle = document.createElement('span');
					chooserToggle.className = `chooser-toggle`;
					chooserToggle.textContent = translationLoader.t(link);
					chooserToggle.dataset.target = targetId+'_'+i;
					cell1.appendChild(chooserToggle);

					let chooserBox = document.createElement('div');
					chooserBox.className = 'chooser-box';
					chooserBox.id = `${targetId+'_'+i}_chooser`;

					asc[i][forparam].forEach(entry => {
						let [label, id] = [entry.substring(0, entry.lastIndexOf(':')), entry.substring(entry.lastIndexOf(':') + 1)];
						let device = document.createElement('div');
						device.className = 'device';
						device.draggable = true;
						device.dataset.id = id;
						device.dataset.label = label;
						device.dataset.target = targetId+'_'+i;
						device.textContent = `${label} (idx: ${id})`;
						chooserBox.appendChild(device);
					});

					cell1.appendChild(chooserBox);

					let row2 = table.insertRow();
					let cell2 = row2.insertCell(0);

					let dropZone = document.createElement('div');
					dropZone.className = 'drop-target';
					dropZone.id = targetId+'_'+i;
					dropZone.dataset[datasetKey] = '';
					cell2.appendChild(dropZone);

					let row3 = table.insertRow();
					let cell3 = row3.insertCell(0);

					let hiddenInput = document.createElement('input');
					hiddenInput.type = 'hidden';
					hiddenInput.name = inputName;
					cell3.appendChild(hiddenInput);

					chooserToggle.addEventListener('click', () => {
						chooserBox.style.display = chooserBox.style.display === 'block' ? 'none' : 'block';
					});

					chooserBox.querySelectorAll('.device').forEach(dev => {
						dev.addEventListener('dragstart', e => {
							e.dataTransfer.setData('id', dev.dataset.id);
							e.dataTransfer.setData('label', dev.dataset.label);
							e.dataTransfer.setData('target', dev.dataset.target);
						});
					});

					dropZone.addEventListener('dragover', e => {
						e.preventDefault();
						dropZone.classList.add('dragover');
					});
					dropZone.addEventListener('dragleave', () => {
						dropZone.classList.remove('dragover');
					});
					dropZone.addEventListener('drop', e => {
						e.preventDefault();
						dropZone.classList.remove('dragover');
						const id = e.dataTransfer.getData('id');
						const label = e.dataTransfer.getData('label');
						const target = e.dataTransfer.getData('target');
						if (dropZone.id !== target) return;

						let currentIds = dropZone.dataset[datasetKey] ? dropZone.dataset[datasetKey].split(',') : [];
						if (!currentIds.includes(id)) {
							let chip = createChip(label, id, dropZone, hiddenInput, datasetKey, false);  // nem draggable
							dropZone.appendChild(chip);
							currentIds.push(id);
							dropZone.dataset[datasetKey] = currentIds.join(',');
							hiddenInput.value = currentIds.join(',');
						}
					});

					let modeRaw = asc[i] && asc[i][mode] != null ? String(asc[i][mode]) : '';
					let modeItems = modeRaw
					.split(',')
					.map(s => s.trim())
					.filter(s => modePrefix === '' || s.startsWith(modePrefix + ':'))
					.map(s => modePrefix === '' ? s : s.substring(modePrefix.length + 1));

					let ids = [];
					modeItems.forEach(idx => {
						let found = asc[i][forparam].find(entry => entry.endsWith(':' + idx));
						if (found) {
							let [label, id] = [found.substring(0, found.lastIndexOf(':')), found.substring(found.lastIndexOf(':') + 1)];
							let chip = createChip(label, id, dropZone, hiddenInput, datasetKey, false);  // nem draggable
							dropZone.appendChild(chip);
							ids.push(id);
						}
					});
					dropZone.dataset[datasetKey] = ids.join(',');
					hiddenInput.value = ids.join(',');
				}

				const dropBlockConfigs = [];

				dropBlockConfigs.push({
					mode: 'Mode1',
					title: "External thermometer",
					link: "➕ Add external thermometer",
					forparam: "tempnameakt",
					modePrefix: 'K',
					targetId: 'external_temp',
					datasetKey: 'k',
					inputName: 'external_temp_id'
				});
				createDropBlock(asc, i, dropBlockConfigs.at(-1));

				dropBlockConfigs.push({
					mode: 'Mode1',
					link: "➕ Add internal thermometer",
					title: "Internal thermometer",
					forparam: "tempnameakt",
					modePrefix: 'B',
					targetId: 'internal_temp',
					datasetKey: 'b',
					inputName: 'internal_temp_id'
				});
				createDropBlock(asc, i, dropBlockConfigs.at(-1));

				dropBlockConfigs.push({
					mode: 'Mode1',
					link: "➕ Add light sensor",
					title: "Light sensor",
					forparam: "luxnameakt",
					modePrefix: 'F',
					targetId: 'light',
					datasetKey: 'f',
					inputName: 'light_id'
				});
				createDropBlock(asc, i, dropBlockConfigs.at(-1));

				dropBlockConfigs.push({
					mode: 'Mode1',
					link: "➕ Add wind sensor",
					title: "Wind sensor",
					forparam: "windnameakt",
					modePrefix: 'S',
					targetId: 'wind',
					datasetKey: 's',
					inputName: 'wind_id'
				});
				createDropBlock(asc, i, dropBlockConfigs.at(-1));

				dropBlockConfigs.push({
					mode: 'Mode1',
					link: "➕ Add vibration sensor",
					title: "Vibration sensor",
					forparam: "vibnameakt",
					modePrefix: 'V',
					targetId: 'vibration',
					datasetKey: 'v',
					inputName: 'vibration_id'
				});
				createDropBlock(asc, i, dropBlockConfigs.at(-1));

				dropBlockConfigs.push({
					mode: 'Mode2',
					link: "➕ Add shutter",
					title: "Shutter switchs",
					forparam: "switchnameakt",

				});
				createDropBlock(asc, i, dropBlockConfigs.at(-1));

				// Mode6

				var mode6Array = String(asc[i].Mode6 || '0,5,,').split(',');

				table.setAttribute('style', 'border-spacing: 3px; margin-bottom: 10px; background-color: #fff !important; border: 1px solid #aaa; width:100%; padding:10px;');
				document.getElementById('asc_content').appendChild(table);

				var row = table.insertRow();
				var cell1 = row.insertCell(0);

				var table = document.createElement('table');
				table.setAttribute('style', 'border-spacing: 3px;');
				cell1.appendChild(table);

				var row = table.insertRow();
				var cell1 = row.insertCell(0);
				var cell2 = row.insertCell(1);
				var cell3 = row.insertCell(2);
				var cell4 = row.insertCell(3);
				var cell5 = row.insertCell(4);
				var cell6 = row.insertCell(5);
				var cell7 = row.insertCell(6);
				var cell8 = row.insertCell(7);
				var cell9 = row.insertCell(8);

				var lograte = document.createElement('h2');
				lograte.innerText = translationLoader.t("Logging level")+':';
				lograte.setAttribute('style', 'font-weight:bold;');
				cell1.appendChild(lograte);

				var lograte_value = document.createElement('input');
				lograte_value.setAttribute('type', 'text');
				lograte_value.setAttribute('id', 'text_0_mode6_' + i);
				lograte_value.setAttribute('value', mode6Array[0]);
				lograte_value.classList.add('input-small');
				lograte_value.setAttribute('title', 'Python Only = 2, Basic = 62, All = 1, None = 0');
				cell2.appendChild(lograte_value);

				var update_cycle = document.createElement('h2');
				update_cycle.innerText = translationLoader.t("Update cycle")+':';
				update_cycle.setAttribute('style', 'font-weight:bold;');
				cell3.appendChild(update_cycle);

				var update_cycle_value = document.createElement('input');
				update_cycle_value.setAttribute('type', 'text');
				update_cycle_value.setAttribute('id', 'text_1_mode6_' + i);
				update_cycle_value.setAttribute('value', mode6Array[1]);
				update_cycle_value.classList.add('input-small');
				cell4.appendChild(update_cycle_value);

							document.getElementById('range_11_mode4_' + i).closest('tr').style.backgroundColor = '#21B9EC';
						}
					}
				}

				hideSaveStatus();

				// adatgyujtes ---------------------------------------------------------

				var row = table.insertRow();
				var cell1 = row.insertCell(0);
				var cell2 = row.insertCell(1);
				var cell3 = row.insertCell(2);
				var cell4 = row.insertCell(3);

				var submitButton = document.createElement('input');
				submitButton.setAttribute('type', 'submit');
				submitButton.classList.add('save-data');
				submitButton.setAttribute('value', translationLoader.t("Save"));
				submitButton.setAttribute('id', 'submitBtn_' + i);
				cell2.appendChild(submitButton);

				document.getElementById('submitBtn_' + i).addEventListener('click', (function(i_copy) {
					return function() {
						showSaveStatus();  // Show saving indicator. | Mentésjelző megjelenítése.

						var data = {
							Mode3: [],
							Mode4: [],
							Mode5: [],
							Mode6: []
						};

						for (var j = 0; j < 12; j++) {
							data.Mode3.push(document.getElementById('text_' + j + '_mode3_' + i_copy).value);
							data.Mode4.push(document.getElementById('text_' + j + '_mode4_' + i_copy).value);
							data.Mode5.push(document.getElementById('text_' + j + '_mode5_' + i_copy).value);
						}
						for (var j = 0; j < 4; j++) {
							data.Mode6.push(document.getElementById('text_' + j + '_mode6_' + i_copy).value);
						}

						let mode1List = [];
						let mode2List = [];

						dropBlockConfigs.forEach(cfg => {
							let zone = document.getElementById(cfg.targetId + '_' + i_copy);
							if (!zone || !zone.dataset[cfg.datasetKey]) return;

							let ids = zone.dataset[cfg.datasetKey].split(',').filter(Boolean);
							ids.forEach(id => {
								if (cfg.mode === 'Mode1') {
									mode1List.push(cfg.modePrefix ? `${cfg.modePrefix}:${id}` : id);
								} else if (cfg.mode === 'Mode2') {
									mode2List.push(id);
								}
							});
						});

						var mode1QueryString = "Mode1=" + encodeURIComponent(mode1List.join(','));
						var mode2QueryString = "Mode2=" + encodeURIComponent(mode2List.join(','));
						var mode3QueryString = "Mode3=" + encodeURIComponent(data.Mode3.join(","));
						var mode4QueryString = "Mode4=" + encodeURIComponent(data.Mode4.join(","));
						var mode5QueryString = "Mode5=" + encodeURIComponent(data.Mode5.join(","));
						var mode6QueryString = "Mode6=" + encodeURIComponent(data.Mode6.join(","));

						var targetminsend = document.getElementById('targetmin_' + i_copy).value;
						var targetmaxsend = document.getElementById('targetmax_' + i_copy).value;

						var port = window.location.port ? ":" + window.location.port : "";
						var baseUrl = window.location.origin;

						var url = baseUrl + "/json.htm?type=command&param=updatehardware&htype=94&extra=ASC&idx=" + asc[i_copy].id +
							"&enabled=true&datatimeout=0&name=" + encodeURIComponent(asc[i_copy].name) +
							"&address=" + encodeURIComponent(asc[i_copy].host) + "&port=" + encodeURIComponent(asc[i_copy].port) +
							"&username=" + encodeURIComponent(asc[i_copy].uname) + "&password=" + encodeURIComponent(asc[i_copy].pass) +
							"&" + mode1QueryString + "&" + mode2QueryString + "&" +
							mode3QueryString + "&" + mode4QueryString + "&" +
							mode5QueryString + "&" + mode6QueryString;

						var completedRequests = 0;

						function sendRequest(url, data) {
							var xhr = new XMLHttpRequest();
							xhr.open("POST", url, true);
							xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");

							xhr.onreadystatechange = function () {
								if (xhr.readyState === 4) {
									if (xhr.status === 200) {
										completedRequests++;
										if (completedRequests === 1) {
											const portnum = window.location.port ? ":" + window.location.port : "";
											const baseUrl = window.location.origin;

											setTimeout(function () {
												$.getJSON("/json.htm?type=command&param=getdevices", function(devicesResult) {
													const redonyHardwareID = asc[i_copy].id;
													let idxTargetMin = null;
													let idxTargetMax = null;

													(Array.isArray(devicesResult.result) ? devicesResult.result : []).forEach(device => {
														if (device.HardwareID == redonyHardwareID && device.Unit == 3) {
															idxTargetMin = device.idx;
														}
														if (device.HardwareID == redonyHardwareID && device.Unit == 4) {
															idxTargetMax = device.idx;
														}
													});

													if (!idxTargetMin || !idxTargetMax) {
													hideSaveStatus();
													alert(translationLoader.t("Save failed") + ": missing setpoint device | hiányzó célhőmérséklet eszköz");
													return;
												}
												const setpointurlMin = `${baseUrl}/json.htm?type=command&param=setsetpoint&idx=${idxTargetMin}&setpoint=${encodeURIComponent(targetminsend)}`;
													const setpointurlMax = `${baseUrl}/json.htm?type=command&param=setsetpoint&idx=${idxTargetMax}&setpoint=${encodeURIComponent(targetmaxsend)}`;

													Promise.all([$.getJSON(setpointurlMin), $.getJSON(setpointurlMax)]).then(results => {
												if (results.some(result => result.status !== "OK")) {
													throw new Error("Domoticz API returned a non-OK status | A Domoticz API hibás állapotot adott vissza");
												}
												location.reload();
											}).catch(e => {
												hideSaveStatus();
												const details = e && e.status ? `HTTP ${e.status}` : (e && e.message ? e.message : String(e));
												alert(translationLoader.t("Save failed") + ": " + details);
											});  // Verify both setpoints before reloading | Mindkét célhőmérséklet mentését ellenőrizzük frissítés előtt
												});
											}, 5000);  // 5 másodperc várakozás az updatehardware után
										}
									} else {
										hideSaveStatus();
										alert(translationLoader.t("Save failed") + ": " + asc[i_copy].name + " (HTTP " + xhr.status + ")");
									}
								}
							};
							xhr.onerror = function () { hideSaveStatus(); alert(translationLoader.t("Save failed") + ": " + asc[i_copy].name); };
							xhr.timeout = 15000;
							xhr.ontimeout = xhr.onerror;
							xhr.send(JSON.stringify(data));
						}
						sendRequest(url, data);
					};
				})(i));
			}
		}
	}).catch(e => { console.error("ASC initialization failed | ASC inicializálási hiba:", e); hideSaveStatus(); document.getElementById("status").textContent = String(e); });
	</script>
